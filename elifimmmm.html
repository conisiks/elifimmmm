<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benimle Evlenir Misin? 💕</title>
    <style>
        body {
            background-color: pink;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .kart {
            background-color: rgba(255, 255, 255, 0.85);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 90%;
            width: 400px;
        }

        h1 {
            color: #d63384;
            font-size: 28px;
            margin-bottom: 30px;
        }

        .buton-grubu {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .btn {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .btn:hover {
            transform: scale(1.08);
            opacity: 0.9;
        }

        .btn-yesil {
            background-color: #28a745;
        }

        .btn-kirmizi {
            background-color: #dc3545;
        }

        #sonuc {
            display: none;
        }

        #sonuc h2 {
            color: #d63384;
            font-size: 32px;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="kart">
        <!-- Soru Alanı -->
        <div id="soru-alani">
            <h1>Benimle evlenir misin? 💖</h1>
            <div class="buton-grubu">
                <button class="btn btn-yesil" onclick="cevapVer()">Evet</button>
                <button class="btn btn-kirmizi" onclick="cevapVer()">Evet</button>
            </div>
        </div>

        <!-- Tıklandıktan Sonra Açılacak Mesaj -->
        <div id="sonuc">
            <h2>Seni çok seviyorum balımmm! 🥰❤️</h2>
        </div>
    </div>

    <script>
        function cevapVer() {
            document.getElementById('soru-alani').style.display = 'none';
            document.getElementById('sonuc').style.display = 'block';
        }
    </script>

</body>
</html>
